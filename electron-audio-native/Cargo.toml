[package]
name = "electron-audio-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"
cpal = "0.15"
symphonia = { version = "0.5", features = ["mp3", "ogg", "wav", "flac"] }
once_cell = "1"

[build-dependencies]
napi-build = "2"